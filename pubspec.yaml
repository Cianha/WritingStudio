name: writing_studio
version: 0.1.0+1
description: Local-first writing studio for Android.
publish_to: none
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_markdown_plus: ^1.0.12
  share_plus: ^11.1.0
  cross_file: ">=0.3.4+2 <0.4.0"
  crypto: ^3.0.6
  uuid: ^4.6.0
  file_picker: ^11.0.3
  flutter_riverpod: ^3.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/db/
